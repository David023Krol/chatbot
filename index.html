<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Vaříme s tátou - support</title>
</head>
<body>

    <h1>Support - Vaříme s tátou the game</h1>
    <h2>Napište svůj problém do ticketu</h2>

    <form>
        <label for="name">Jméno</label>
        <input type="text" id="name" name="name" placeholder="Vaše uživatelské jméno" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="vas@email.cz" required>

        <label for="subject">Předmět</label>
        <input type="text" id="subject" name="subject" placeholder="Např. hra se nespustí..." required>

        <label for="message">Popis problému</label>
        <textarea id="message" name="message" rows="6" placeholder="Popište svůj problém..." required></textarea>

        <button type="submit">Odeslat ticket</button>
    </form>

</body>
</html>
